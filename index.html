<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="한낮의 해바라기 · 사랑이란 감정의 스펙트럼">
<title>한낮의 해바라기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* 레이아웃: 연노랑 종이 위에 책 한 권. 표지(해바라기) → 차례(점선·쪽수) → 한 쪽에 시 한 편, 앞 장/다음 장으로 넘김 */
:root{
  color-scheme: light;
  --paper:#FBF1C7;     /* 연노랑 바탕 */
  --page:#FFFBEA;      /* 책 속지 */
  --ink:#3B2E1E;       /* 갈색 먹 */
  --muted:#7C6A4C;
  --line:#E9D99E;
  --sun:#F2B705;       /* 해바라기 꽃잎 */
  --sun-deep:#B97F05;
  --seed:#5B3A1B;      /* 씨앗 */
  --leaf:#6C7A3A;
  --f-title:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-poem:"Gowun Batang","AppleMyungjo","Batang",serif;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-poem);font-size:17px;line-height:1.9;margin:0;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--sun-deep);outline-offset:3px;border-radius:4px}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));font-family:var(--f-ui);font-size:15px}
.top-in .name{font-family:var(--f-title);font-weight:800;font-size:17px;text-decoration:none;margin-right:auto;letter-spacing:.02em}
.top-in a.nav{text-decoration:none;color:var(--muted)}
.top-in a.nav:hover,.top-in a.nav[aria-current="page"]{color:var(--ink)}
.music{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:14px;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:99px;padding:5px 13px 5px 9px;cursor:pointer}
.music .dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,var(--seed) 0 34%,var(--sun) 36% 100%)}
.music[aria-pressed="true"] .dot{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:8px 80px}

/* 표지 */
.cover{max-width:760px;margin:0 auto;display:grid;justify-items:center;text-align:center;gap:6px;padding-block:28px 40px}
.cover canvas{width:min(78vw,340px);height:auto;aspect-ratio:1;max-width:100%}
.cover .kicker{font-family:var(--f-ui);font-size:14px;letter-spacing:.35em;color:var(--muted);margin-top:8px}
.cover h1{font-family:var(--f-title);font-weight:800;font-size:clamp(38px,8vw,58px);line-height:1.2;margin:4px 0 2px;letter-spacing:.04em}
.cover .by{font-size:18px;color:var(--muted);margin:0 0 26px}
.open{font-family:var(--f-ui);font-size:17px;color:var(--ink);background:var(--sun);border:0;border-radius:99px;padding:13px 30px;cursor:pointer;box-shadow:0 3px 0 var(--sun-deep);transition:transform .15s}
.open:hover{transform:translateY(-1px)}
.open:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-deep)}
.cover .hint{font-family:var(--f-ui);font-size:13.5px;color:var(--muted);margin-top:12px}

/* 책 속지 */
.sheet{max-width:640px;margin:18px auto 0;background:var(--page);border:1px solid var(--line);border-radius:4px 4px 4px 4px;box-shadow:0 1px 0 var(--line),0 18px 40px -26px rgba(91,58,27,.35);padding:clamp(28px,6vw,64px) clamp(22px,7vw,72px) 40px;position:relative}
.sheet::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;background:linear-gradient(90deg,rgba(91,58,27,.07),transparent);border-radius:4px 0 0 4px}
.pageno{text-align:center;font-family:var(--f-ui);color:var(--muted);font-size:13.5px;margin-top:36px;letter-spacing:.2em}

/* 차례 */
.toc h2,.words h2{font-family:var(--f-title);font-weight:800;font-size:28px;text-align:center;margin:0 0 6px;letter-spacing:.3em}
.toc .sub{text-align:center;font-family:var(--f-ui);font-size:14px;color:var(--muted);margin:0 0 30px}
.toc .part{font-family:var(--f-ui);font-size:14px;letter-spacing:.2em;color:var(--sun-deep);margin:26px 0 8px;display:flex;align-items:center;gap:10px}
.toc .part::after{content:"";flex:1;height:1px;background:var(--line)}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:flex;align-items:baseline;gap:8px;text-decoration:none;padding:7px 0;font-size:18px}
.toc li a .t{flex:none;max-width:75%}
.toc li a .lead{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-5px);min-width:20px}
.toc li a .n{flex:none;font-family:var(--f-ui);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.toc li a:hover .t{color:var(--sun-deep)}
.poet .wordslink{display:block;text-align:center;margin-top:30px;font-family:var(--f-ui);font-size:15px;color:var(--muted);text-decoration:none}
.toc .wordslink{display:block;text-align:center;margin-top:30px;font-family:var(--f-ui);font-size:15px;color:var(--muted)}
.sample{display:inline-block;font-family:var(--f-ui);font-size:12px;background:var(--paper);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:0 9px;margin-left:6px;vertical-align:3px}
.note{font-family:var(--f-ui);font-size:14px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:0 0 24px;line-height:1.7}

/* 시 */
.poem h2{font-family:var(--f-title);font-weight:800;font-size:clamp(26px,5vw,32px);text-align:center;margin:0 0 6px;text-wrap:balance;letter-spacing:.06em}
.poem .meta{text-align:center;font-family:var(--f-ui);font-size:14px;color:var(--muted);margin:0 0 34px}
.poem .flower{display:block;margin:0 auto 14px;width:30px;height:30px}
.poem .body{width:fit-content;max-width:100%;margin:0 auto;white-space:pre-wrap;font-size:clamp(17px,2.6vw,19px);line-height:2.15;letter-spacing:.01em}
.turn{display:flex;justify-content:space-between;gap:12px;margin-top:40px;font-family:var(--f-ui);font-size:15px}
.turn a{text-decoration:none;color:var(--muted);max-width:48%}
.turn a:hover{color:var(--ink)}
.turn a b{display:block;font-family:var(--f-poem);font-weight:400;color:var(--ink);font-size:16px}
.turn .next{text-align:right;margin-left:auto}

.photo{margin:-8px auto 30px;max-width:520px;background:#fff;padding:10px 10px 12px;border-radius:3px;box-shadow:0 1px 2px rgba(91,58,27,.12),0 14px 30px -18px rgba(91,58,27,.45);transform:rotate(-.6deg)}
.photo img{display:block;width:100%;height:auto;border-radius:2px}
.poet h2{font-family:var(--f-title);font-weight:800;font-size:28px;text-align:center;margin:0 0 28px;letter-spacing:.12em}
.portrait{margin:0 auto 22px;width:min(100%,300px);background:#fff;padding:12px 12px 14px;border-radius:3px;box-shadow:0 1px 2px rgba(91,58,27,.12),0 16px 32px -18px rgba(91,58,27,.5);transform:rotate(1deg)}
.portrait img{display:block;width:100%;height:auto;border-radius:2px}
.portrait .ph{aspect-ratio:4/5;display:grid;place-content:center;justify-items:center;gap:10px;background:var(--paper);border-radius:2px;font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.portrait .ph .flower{width:54px;height:54px;margin:0}
.pname{text-align:center;font-family:var(--f-title);font-weight:800;font-size:24px;margin:0 0 26px;letter-spacing:.06em}
.pname span{display:block;font-family:var(--f-ui);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.3em;margin-bottom:2px}
.intro{max-width:32em;margin:0 auto}
.intro p{margin:0 0 1.2em;font-size:17px;line-height:2;text-indent:.6em}
.facts{max-width:32em;margin:28px auto 0;padding:16px 0 0;border-top:1px solid var(--line);display:grid;gap:6px;font-family:var(--f-ui);font-size:15px}
.facts div{display:flex;gap:14px}
.facts dt{color:var(--muted);min-width:7.5em}
.facts dd{margin:0}
.top-in .short{display:none}
@media (max-width:520px){.top-in .long{display:none}.top-in .short{display:inline}}
.cover .spectrum{font-size:18px;margin:2px 0 4px;letter-spacing:.12em;color:var(--ink)}
.cover .spectrum::after{content:"";display:block;height:3px;width:180px;margin:10px auto 0;border-radius:3px;background:linear-gradient(90deg,#F4A6A6,#F7C873,#F2E27A,#A9D99B,#9CC9E8,#B7A7E0);opacity:.85}
.quote{margin:0 auto 30px;max-width:30em;text-align:center;padding:18px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}
.quote::before{content:"";position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:120px;height:3px;border-radius:3px;background:linear-gradient(90deg,#F4A6A6,#F7C873,#F2E27A,#A9D99B,#9CC9E8,#B7A7E0)}
.quote p{margin:0;white-space:pre-line;font-size:18px;line-height:2}
.quote cite{display:block;margin-top:8px;font-style:normal;font-family:var(--f-ui);font-size:13.5px;color:var(--muted)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.foot{text-align:center;padding-block:0 40px;font-family:var(--f-ui);font-size:13px}
.foot a{color:var(--muted);text-decoration:none;opacity:.7}
.adm{text-align:center;font-family:var(--f-ui);font-size:14px;margin:-14px 0 14px}
.adm a{color:var(--sun-deep)}
.form-sheet h2{font-family:var(--f-title);font-weight:800;font-size:26px;text-align:center;margin:0 0 24px;letter-spacing:.1em}
.center{text-align:center;justify-content:center}
.pform{display:flex;flex-direction:column;gap:8px;font-family:var(--f-ui)}
.pform>label{font-size:15px;font-weight:700;margin-top:10px}
.pform label small{font-weight:400;color:var(--muted);margin-left:6px}
.pform input[type=email],.pform input[type=password],.pform input:not([type]),.pform input[type=date],.pform textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.pform textarea{font-family:var(--f-poem);font-size:17px;line-height:1.9;resize:vertical}
.pform input:focus,.pform textarea:focus{outline:none;border-color:var(--sun-deep)}
.imgpick{display:flex;flex-direction:column;gap:8px}
.imgpick img{max-width:220px;border-radius:6px;border:1px solid var(--line)}
.chk{font-size:14px;display:flex;gap:6px;align-items:center}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn{font:inherit;font-family:var(--f-ui);font-size:16px;border-radius:99px;padding:10px 22px;cursor:pointer;border:0;background:var(--sun);color:var(--ink);text-decoration:none;box-shadow:0 2px 0 var(--sun-deep)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line)}
.btn.danger{background:transparent;box-shadow:none;border:1.5px solid #B4472B;color:#B4472B}
.btn.danger.armed{background:#B4472B;color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.msg{font-size:14.5px}.msg.err{color:#B4472B}
.words .body{font-size:17px;line-height:2;max-width:32em;margin:24px auto 0}

/* 음악 안내 */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.top-in{gap:12px;font-size:14px}.music .lbl{display:none}.music{padding:6px}}
</style>
</head>

<header class="top">
  <div class="top-in">
    <a class="name" href="#cover">한낮의 해바라기</a>
    <a class="nav" href="#contents" id="nav-toc">차례</a>
    <a class="nav" href="#poet" id="nav-words"><span class="long">시인을 소개합니다</span><span class="short">시인 소개</span></a>
    <button class="music" id="music" type="button" aria-pressed="false" aria-label="배경 음악 켜기"><span class="dot"></span><span class="lbl">음악 켜기</span></button>
  </div>
</header>
<main id="main"></main>
<footer class="foot" id="foot"></footer>
<canvas id="fx" aria-hidden="true"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== 시 원고 =====
// DB에 연결되면 DB의 시를 보여 주고, 연결 전에는 아래 시를 보여 줍니다.
const BOOK = {
  title: '한낮의 해바라기',
  author: '아버지',
  // 시인 소개: 사진은 images 폴더에 "시인.png"(또는 .jpg)로 넣으면 자동으로 붙습니다.
  poet: {
    name: '한낮의 해바라기',
    photo: 'images/시인',
    quote: '해석하지 않아도 금방 알아채는\n초보 창작시/자작시/사랑시를 쓰는 사람.\n사랑을 스펙트럼에 비추고 싶은 사람.',
    intro: [
      '아버지는 블로그 맨 위에 이렇게 적어 두었습니다. “창작시 : 사랑이란 감정의 스펙트럼?” 한 줄기 빛이 프리즘을 지나면 여러 빛깔로 갈라지듯, 아버지는 사랑을 한 가지 색으로 말하지 않습니다. 설레는 빛도, 아린 빛도, 오래 데워진 빛도 모두 사랑이라고 씁니다.',
      '아버지의 시는 거창한 데서 시작하지 않습니다. 겨우내 말린 시래기, 밥상 위의 된장국 한 사발처럼 늘 곁에 있던 작은 것들을 오래 들여다보다가, 결국 곁에 있는 사람의 마음으로 건너갑니다. 그래서 해석하지 않아도 금방 마음에 닿습니다.',
      '필명 ‘한낮의 해바라기’는 아버지가 좋아하는 꽃에서 왔습니다. 해가 가장 높이 뜬 한낮에도 해를 향해 고개를 드는 꽃처럼, 아버지의 시는 늘 따뜻한 쪽을 바라봅니다.',
      '이곳은 블로그에 한 편씩 쌓여 온 아버지의 시를 한 권의 시집처럼 묶어 두려고 딸이 만든 공간입니다. 천천히 한 장씩 넘겨 가며 읽어 주세요.',
    ],
    facts: [['필명', '한낮의 해바라기'], ['쓰는 시', '창작시 · 자작시 · 사랑시'], ['좋아하는 꽃', '해바라기'], ['시를 쓰는 곳', '블로그']],
  },
  // 이미지: images 폴더에 "제목.png"(또는 .jpg .jpeg .webp)로 넣으면 시 위에 자동으로 붙습니다.
  poems: [
    { title:'시래기 된장국', written_on:'2026-11-08', body:
`삶의 초록을 바람에 털어내고
물기가 얼었다 녹았다
바짝 마른 그 잎이

비로소 세상에서
가장 부드러운 것으로 돌아와
내 앞에 살포시 그 몸을 뉘였는데

나는 나를 온전히 허물어
그 사람의 허기진 마음을
이 국 한 사발처럼
정갈하게 채워준 적 있었던가

헛헛한 마음의 깊은 곳까지
이렇게 다정하게 스며들어 보았던가

사랑도 이렇게
모진 계절을 건너와야 했다면

나도 모진 계절을 말려서
그 사람의 아린 허기를
따뜻하게 채우고 싶네` },
  ],
};
// ===================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ===== Supabase 설정 (시집 전용 프로젝트) =====
const SUPABASE_URL = 'https://xnzytzlqhgluiiomrkwt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_7rb8aS6JxYk_c7vHENqgfQ_1fFKN0zh';
const BUCKET = 'poem-images';
// =============================================
const SB = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let ADMIN = false, EMAIL = '';
let P = [];
function normalize(list){
  return list.map((r, k) => {
    const [y, m, d] = String(r.written_on).split('-').map(Number);
    return { ...r, id: r.id != null ? 'p' + r.id : 'p' + (k + 1), dbId: r.id ?? null, y, m, d,
      part: `${y}년 ${m}월`, date: `${m}월 ${d}일`,
      imageUrl: r.image_path && SB ? SB.storage.from(BUCKET).getPublicUrl(r.image_path).data.publicUrl : '' };
  }).sort((a, b) => (b.written_on > a.written_on) - (b.written_on < a.written_on) || (b.dbId ?? 0) - (a.dbId ?? 0));
}
P = normalize(BOOK.poems);
const pageOf = i => i + 3; // 표지·차례·시인 소개 다음부터 쪽수
async function loadPoems(){
  if (!SB) return;
  const { data, error } = await SB.from('poems').select('*').order('written_on', { ascending: false });
  if (error) { console.warn('시를 불러오지 못했습니다', error); return; }
  P = normalize(data); route();
}

// ---------- 해바라기 (씨앗은 황금각 137.5°로 배열) ----------
function drawSunflower(cv, t){
  const ctx = cv.getContext('2d'), S = cv.width, c = S/2;
  ctx.clearRect(0,0,S,S);
  const sway = Math.sin(t/2600) * 0.025;
  ctx.save(); ctx.translate(c,c); ctx.rotate(sway);
  const R = S*0.2, petals = 34;
  for (let layer = 0; layer < 2; layer++) {
    for (let i = 0; i < petals; i++) {
      const a = (i + layer*0.5) / petals * Math.PI*2;
      ctx.save(); ctx.rotate(a);
      const len = S*(layer ? 0.21 : 0.24), w = S*0.045;
      const g = ctx.createLinearGradient(R*0.8,0,R+len,0);
      g.addColorStop(0, layer ? '#D99A06' : '#E7A904'); g.addColorStop(1, layer ? '#F6C93A' : '#F9D35A');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(R*0.8,0);
      ctx.quadraticCurveTo(R+len*0.45, -w, R+len, 0);
      ctx.quadraticCurveTo(R+len*0.45, w, R*0.8, 0);
      ctx.fill(); ctx.restore();
    }
  }
  ctx.fillStyle = '#4A2E14'; ctx.beginPath(); ctx.arc(0,0,R*1.02,0,Math.PI*2); ctx.fill();
  const N = 420, GA = Math.PI*(3-Math.sqrt(5));
  for (let i = 1; i < N; i++) {

    ctx.fillStyle = i % 3 ? '#6B4520' : '#8A5C2A';

function shrink(file){
  return new Promise(resolve => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return resolve(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      if (k === 1 && file.size < 1.5e6) { URL.revokeObjectURL(url); return resolve(file); }
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); resolve(b ? new File([b], 'photo.jpg', { type:'image/jpeg' }) : file); }, 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

const Music = (() => {
  // 「해바라기 왈츠」 — 이 페이지를 위해 새로 지은 3/4박자 곡 (G장조 16마디). 음원 파일 없이 브라우저가 직접 연주합니다.

  const CH = { G:[43,[59,62]], Em:[40,[55,59]], C:[48,[55,64]], D:[50,[57,66]], Am:[45,[57,60]], Bm:[47,[62,66]] };
  const PROG = ['G','Em','C','D','G','Em','Am','D','C','D','Bm','Em','C','D','G','G'];
  const MEL = [
    [[0,74,1],[1,71,1],[2,74,1]], [[0,76,2],[2,74,1]], [[0,72,1],[1,76,1],[2,79,1]], [[0,78,2],[2,74,1]],

    [[0,76,1],[1,72,1],[2,76,1]], [[0,78,1],[1,74,1],[2,81,1]], [[0,79,2],[2,74,1]], [[0,79,3]],
  ];

    if (ambientOn && t - lastAmb > 650) { lastAmb = t; parts.push(Object.assign(petal(Math.random()*cv.width/dpr, -20, (Math.random()-.3)*.6, .6 + Math.random()*.6), {decay: .0018})); if (Math.random() < .6) parts.push(Object.assign(star(Math.random()*cv.width/dpr, Math.random()*cv.height/dpr*.6, 0, -.15), {decay: .008})); }
    parts = parts.filter(p => p.life > 0 && p.y < cv.height/dpr + 40);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if (p.k === 'p') { p.vy = Math.min(p.vy + .05, 1.6); p.vx *= .99; p.vx += Math.sin(t/600 + p.r)*.02; p.a += p.va; }
      else { p.vy += .03; p.vx *= .98; p.tw += .25; }

function setMusicUI(){

}
$('#music').addEventListener('click', () => { Music.on ? Music.stop() : Music.start(); setMusicUI(); });
document.addEventListener('click', e => {
  if (e.target.id === 'open') {
    const r = e.target.getBoundingClientRect();

    FX.burst(r.left + r.width/2, r.top + r.height/2, 48); setTimeout(() => Music.sparkle(true), 60);

  }
});
document.addEventListener('click', async e => {
  const d = e.target.closest('[data-del]'); if (d) return deletePoem(d);

});
document.addEventListener('change', e => {
  if (e.target.id === 'w-img' && e.target.files[0]) { WRITE.file = e.target.files[0]; const pv = $('#w-prev'); pv.src = URL.createObjectURL(WRITE.file); pv.hidden = false; }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'poemform') return savePoem();
  if (e.target.id === 'loginform') {
    const m = $('#lmsg'); m.className = 'msg'; m.textContent = '로그인 중…';
    const { error } = await SB.auth.signInWithPassword({ email: $('#l-email').value.trim(), password: $('#l-pw').value });
    if (error) { m.className = 'msg err'; m.textContent = '로그인하지 못했습니다. 이메일과 비밀번호를 확인해 주세요.'; return; }
    location.hash = '#write';
  }
});
if (SB) {
  SB.auth.getSession().then(({ data }) => { ADMIN = !!data.session; EMAIL = ADMIN ? data.session.user.email : ''; route(); });
  SB.auth.onAuthStateChange((_e, sess) => { const was = ADMIN; ADMIN = !!sess; EMAIL = sess ? sess.user.email : ''; if (was !== ADMIN) route(); });
}
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const h = location.hash.slice(1), i = P.findIndex(p => p.id === h); if (i < 0) return;
  if (e.key === 'ArrowRight' && P[i+1]) location.hash = '#' + P[i+1].id;
  if (e.key === 'ArrowLeft' && P[i-1]) location.hash = '#' + P[i-1].id;
});
window.addEventListener('hashchange', () => {
  route(); window.scrollTo(0, 0);
  const h = location.hash.slice(1);
  if (P.some(p => p.id === h) || h === 'poet') { const t = document.querySelector('.sheet h2'); if (t) { const r = t.getBoundingClientRect(); FX.twinkle(r.left + r.width/2, r.top + r.height/2); } Music.sparkle(false); }
});
route();
loadPoems();
